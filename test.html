<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Portfolio Colors</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..900&family=Inter:wght@300..700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #F5F0E8;
            color: #1A1208;
            min-height: 100vh;
        }

        .hero {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #EFEBE3 0%, #F5F0E8 50%, #FEFCF8 100%);
            text-align: center;
            padding: 0 24px;
        }

        .hero h1 {
            font-family: 'Fraunces', serif;
            font-size: clamp(3.5rem, 9vw, 8rem);
            font-weight: 600;
            line-height: 1;
            margin-bottom: 32px;
        }

        .hero .accent {
            color: #E8570C;
        }

        .hero p {
            font-size: 1.5rem;
            color: #4A3C2A;
            font-weight: 300;
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.5;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 72px;
            background: rgba(245, 240, 232, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(232, 87, 12, 0.1);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .navbar .logo {
            font-family: 'Fraunces', serif;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #E8570C 0%, #FF6B1A 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">K.</div>
    </div>

    <section class="hero">
        <div>
            <h1>
                Building<br>
                Experiences<br>
                That<br>
                <span class="accent">Matter</span>
            </h1>
            <p>Full-stack developer crafting interfaces that think, feel, and inspire action</p>
        </div>
    </section>
</body>
</html>
